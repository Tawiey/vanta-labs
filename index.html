  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="work.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <!-- Cal.com embed. The official loader injects app.cal.com/embed/embed.js at
       runtime, so it can't carry an SRI hash like the React/Babel CDNs above —
       a deliberate exception (see CLAUDE.md §2/§7). Buttons opt in with
       data-cal-link / data-cal-namespace; Cal uses click delegation, so it works
       on React-rendered elements. -->
  <script type="text/javascript">
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
    Cal("init", "discovery-call", { origin: "https://app.cal.com" });
    Cal.ns["discovery-call"]("ui", { cssVarsPerTheme: { dark: { "cal-brand": "#a8ff0e" } }, hideEventTypeDetails: false, layout: "month_view" });

    // Failover flag: the loader above appends embed.js to <head>. If it can't
    // load (CDN/network down), the popup delegation never attaches — so flag it
    // and the booking button falls back to opening cal.com directly.
    (function () {
      var s = document.querySelector('script[src="https://app.cal.com/embed/embed.js"]');
      if (!s) { window.__calEmbedFailed = true; return; }
      s.addEventListener("error", function () { window.__calEmbedFailed = true; });
    })();
  </script>
</body>
</html>
