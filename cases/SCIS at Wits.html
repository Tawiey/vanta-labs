<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SCIS @ Wits — Vanta Labs Case Study</title>
  <meta name="description" content="How we gave the Southern Centre for Inequality Studies its own voice — a standalone site carved out from a 100-year university." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="case-study.css" />
  <style>
    :root { --accent: #9ee84d; --accent-ink: #9ee84d; }
    [data-theme="dark"] .cs-stat-v { color: var(--accent); }
    @keyframes ca-rotate { to { transform: rotate(360deg); } }
    @keyframes globe-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(158,232,77,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(158,232,77,0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel">
    const ACCENT = '#9ee84d';
    const { useState, useEffect, useRef } = React;

    function Globe({ size = 200, accent }) {
      const pins = [
        { top: '38%', left: '52%', color: accent },
        { top: '56%', left: '50%', color: accent },
        { top: '44%', left: '36%', color: '#5db8ff' },
        { top: '30%', left: '62%', color: '#5db8ff' },
        { top: '50%', left: '72%', color: '#5db8ff' },
        { top: '62%', left: '40%', color: '#ff9f5b' },
        { top: '35%', left: '45%', color: '#ff9f5b' },
        { top: '48%', left: '28%', color: '#5db8ff' },
        { top: '58%', left: '64%', color: accent },
      ];
      return (
        <div style={{ position:'relative', width:size, height:size }}>
          <div style={{ position:'absolute', inset:-10, borderRadius:'50%', border:'1px dashed rgba(255,255,255,0.08)', animation:'ca-rotate 60s linear infinite' }} />
          <div style={{ position:'absolute', inset:0, borderRadius:'50%', background:'radial-gradient(circle at 32% 28%, rgba(255,255,255,0.07), transparent 55%), radial-gradient(circle at center, #0e1a30 0%, #06101e 90%)', border:'1px solid rgba(255,255,255,0.15)', boxShadow:'inset 0 0 60px rgba(0,0,0,0.5), 0 0 40px rgba(158,232,77,0.06)' }} />
          <svg style={{ position:'absolute', inset:0, width:'100%', height:'100%', opacity:0.12 }} viewBox="0 0 100 100">
            <ellipse cx="50" cy="50" rx="20" ry="49" fill="none" stroke="white" strokeWidth="0.5" />
            <ellipse cx="50" cy="50" rx="40" ry="49" fill="none" stroke="white" strokeWidth="0.5" />
            <line x1="1" y1="50" x2="99" y2="50" stroke="white" strokeWidth="0.5" />
            <ellipse cx="50" cy="50" rx="49" ry="18" fill="none" stroke="white" strokeWidth="0.5" />
          </svg>
          {pins.map((p, i) => (
            <div key={i} style={{ position:'absolute', top:p.top, left:p.left, width:7, height:7, borderRadius:'50%', background:p.color, transform:'translate(-50%,-50%)', boxShadow:`0 0 0 3px rgba(0,0,0,0.6), 0 0 10px ${p.color}`, animation:`globe-pulse ${1.5 + i * 0.3}s ease-out infinite` }} />
          ))}
        </div>
      );
    }

    function HeroArt() {
      const streams = ['Budgets','Wealth','Work','Care','Climate'];
      const [active, setActive] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setActive(a => (a + 1) % streams.length), 2200);
        return () => clearInterval(id);
      }, []);
      return (
        <div style={{ position:'absolute', inset:0, background:`radial-gradient(100% 70% at 50% 100%, rgba(158,232,77,0.12), transparent 55%), linear-gradient(200deg, #08111e, #0e1a30)`, display:'flex', flexDirection:'column', justifyContent:'center', padding:28, gap:20 }}>
          <div className="art-dot-overlay" />
          <div style={{ position:'absolute', top:18, left:18, display:'flex', alignItems:'center', gap:7, fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.08em', color:ACCENT }}>
            <span style={{ width:6, height:6, borderRadius:'50%', background:ACCENT, boxShadow:`0 0 8px ${ACCENT}`, display:'inline-block' }} />
            SCIS · WITS UNIVERSITY
          </div>
          <div style={{ background:'rgba(0,0,0,0.35)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:10, overflow:'hidden', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)' }}>
            <div style={{ display:'flex', borderBottom:'1px solid rgba(255,255,255,0.06)' }}>
              {streams.map((s, i) => (
                <div key={s} onClick={() => setActive(i)} style={{ flex:1, padding:'9px 4px', textAlign:'center', fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.06em', textTransform:'uppercase', color: active===i ? ACCENT : 'rgba(255,255,255,0.35)', borderBottom: active===i ? `2px solid ${ACCENT}` : '2px solid transparent', cursor:'pointer', transition:'color .3s', userSelect:'none' }}>{s}</div>
              ))}
            </div>
            <div style={{ padding:'14px 16px 16px', minHeight:70 }}>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:9.5, color:'rgba(255,255,255,0.35)', letterSpacing:'0.06em', marginBottom:8, textTransform:'uppercase' }}>Active programme</div>
              <div style={{ fontSize:13, fontWeight:500, color:'#fff', marginBottom:6 }}>
                {['Public Economy','Wealth & Ownership','Labour Markets','Care Economy','Climate Justice'][active]} Programme
              </div>
              <div style={{ display:'flex', gap:4, alignItems:'flex-end', height:28, marginTop:8 }}>
                {[40,65,55,80,45,90,70].map((h,i) => (
                  <div key={i} style={{ flex:1, height:`${h}%`, borderRadius:2, background: i===5 ? ACCENT : 'rgba(255,255,255,0.15)', transition:'background .3s' }} />
                ))}
              </div>
            </div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:18 }}>
            <Globe size={120} accent={ACCENT} />
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {[['9','Partner countries'],['14','Academic institutions'],['7y','Of research output']].map(([v,l]) => (
                <div key={l}>
                  <div style={{ fontSize:18, fontWeight:600, color:ACCENT, letterSpacing:'-0.02em', lineHeight:1 }}>{v}</div>
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:8.5, color:'rgba(255,255,255,0.4)', letterSpacing:'0.06em', textTransform:'uppercase', marginTop:2 }}>{l}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ShowcaseArt() {
      const streams = ['Budgets','Wealth','Work','Care','Climate'];
      const [tab, setTab] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setTab(t => (t + 1) % streams.length), 1800);
        return () => clearInterval(id);
      }, []);
      return (
        <div style={{ position:'absolute', inset:0, background:`radial-gradient(80% 60% at 20% 80%, rgba(158,232,77,0.12), transparent 50%), linear-gradient(160deg, #08111e, #0e1a30)`, overflow:'hidden' }}>
          <div className="art-dot-overlay" />
          <div style={{ position:'absolute', top:0, left:0, right:0, height:36, background:'rgba(0,0,0,0.5)', borderBottom:'1px solid rgba(255,255,255,0.06)', display:'flex', alignItems:'center', padding:'0 14px', gap:8 }}>
            {['#ff5f57','#febc2e','#28c840'].map(c => <span key={c} style={{ width:9, height:9, borderRadius:'50%', background:c, opacity:0.7 }} />)}
            <div style={{ flex:1, margin:'0 10px', height:20, background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:4, display:'flex', alignItems:'center', paddingLeft:8 }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:8.5, color:'rgba(255,255,255,0.3)', letterSpacing:'0.04em' }}>wits-scis.vercel.app</span>
            </div>
          </div>
          <div style={{ position:'absolute', top:36, left:0, right:0, height:34, background:'rgba(8,17,30,0.9)', borderBottom:'1px solid rgba(255,255,255,0.06)', display:'flex', alignItems:'center', padding:'0 20px', gap:20 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:ACCENT, fontWeight:600, letterSpacing:'0.06em' }}>SCIS</span>
            {['RESEARCH','APPROACH','IMPACT','NEWS','STUDY'].map(t => (
              <span key={t} style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(255,255,255,0.35)', letterSpacing:'0.06em' }}>{t}</span>
            ))}
          </div>
          <div style={{ position:'absolute', top:70, left:20, right:'45%', bottom:0, display:'flex', flexDirection:'column', justifyContent:'center', paddingBottom:20, gap:10 }}>
            <div style={{ height:5, width:'40%', background:'rgba(255,255,255,0.6)', borderRadius:2 }} />
            <div style={{ height:5, width:'65%', background:'rgba(255,255,255,0.6)', borderRadius:2 }} />
            <div style={{ height:4, width:'80%', background:'rgba(255,255,255,0.2)', borderRadius:2, marginTop:4 }} />
            <div style={{ height:4, width:'70%', background:'rgba(255,255,255,0.2)', borderRadius:2 }} />
            <div style={{ height:4, width:'55%', background:'rgba(255,255,255,0.2)', borderRadius:2 }} />
            <div style={{ display:'flex', gap:8, marginTop:6 }}>
              <div style={{ padding:'6px 12px', background:ACCENT, borderRadius:999, fontFamily:'var(--font-mono)', fontSize:8, color:'#08111e', fontWeight:700, letterSpacing:'0.06em' }}>EXPLORE RESEARCH</div>
              <div style={{ padding:'6px 12px', border:'1px solid rgba(255,255,255,0.2)', borderRadius:999, fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(255,255,255,0.5)', letterSpacing:'0.06em' }}>SUBSCRIBE</div>
            </div>
          </div>
          <div style={{ position:'absolute', top:70, right:14, width:'42%', bottom:14, background:'rgba(0,0,0,0.35)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:8, overflow:'hidden' }}>
            <div style={{ display:'flex', borderBottom:'1px solid rgba(255,255,255,0.06)' }}>
              {streams.map((s, i) => (
                <div key={s} style={{ flex:1, padding:'7px 2px', textAlign:'center', fontFamily:'var(--font-mono)', fontSize:7, letterSpacing:'0.04em', textTransform:'uppercase', color: tab===i ? ACCENT : 'rgba(255,255,255,0.3)', borderBottom: tab===i ? `1.5px solid ${ACCENT}` : '1.5px solid transparent', transition:'color .3s' }}>{s}</div>
              ))}
            </div>
            <div style={{ padding:'12px' }}>
              <div style={{ height:4, width:'60%', background:'rgba(255,255,255,0.5)', borderRadius:2, marginBottom:8 }} />
              <div style={{ height:3, width:'90%', background:'rgba(255,255,255,0.15)', borderRadius:2, marginBottom:4 }} />
              <div style={{ height:3, width:'75%', background:'rgba(255,255,255,0.15)', borderRadius:2, marginBottom:4 }} />
              <div style={{ height:3, width:'50%', background:'rgba(255,255,255,0.15)', borderRadius:2, marginBottom:10 }} />
              <div style={{ display:'flex', gap:4, alignItems:'flex-end', height:36 }}>
                {[55,80,40,95,60,70,45,85].map((h,i) => (
                  <div key={i} style={{ flex:1, height:`${h}%`, borderRadius:2, background: i===3 ? ACCENT : `rgba(158,232,77,${0.1 + i*0.03})` }} />
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const NEXT = { name: 'Vanta Labs (this site)', cat: 'Self-published · Brand & marketing', href: 'Vanta Labs.html' };

    function Page() {
      useEffect(() => {
        document.documentElement.style.setProperty('--accent', ACCENT);
      }, []);
      return (
        <>
          <CaseNav accent={ACCENT} />
          <main>
            <section className="cs-hero">
              <div className="container">
                <Reveal>
                  <a href="../index.html#work" className="cs-back">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="M9 11L5 7l4-4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                    All work
                  </a>
                </Reveal>
                <Reveal delay={40}>
                  <div className="cs-chips">
                    <span className="cs-chip"><span className="cs-chip-dot" style={{ background:ACCENT, color:ACCENT }} />Client work</span>
                    <span className="cs-chip">2025 – 2026</span>
                    <span className="cs-chip">Research & Academic</span>
                    <span className="cs-chip" style={{ borderColor:`${ACCENT}50`, color:ACCENT }}>Launching mid-2026</span>
                  </div>
                </Reveal>
                <div className="cs-hero-grid">
                  <div>
                    <Reveal delay={80}>
                      <h1 className="display">
                        Carving out space for research that{' '}
                        <span className="display-em">changes policy.</span>
                      </h1>
                    </Reveal>
                    <Reveal delay={160}>
                      <p className="lede">
                        The Southern Centre for Inequality Studies at Wits University had
                        spent seven years producing research that matters — on budgets, wealth,
                        labour, care, and climate. But inside the university's parent site,
                        that work was invisible. They needed a home of their own.
                      </p>
                    </Reveal>
                    <Reveal delay={220}>
                      <div className="cs-services">
                        {['IA & UX','UI & motion','Web build','CMS'].map(s => (
                          <span key={s} className="tag">{s}</span>
                        ))}
                      </div>
                    </Reveal>
                  </div>
                  <Reveal delay={120} className="cs-hero-art">
                    <HeroArt />
                  </Reveal>
                </div>
              </div>
            </section>

            <section className="cs-section">
              <div className="container">
                <Eyebrow num="01">The brief</Eyebrow>
                <div className="cs-2col">
                  <div>
                    <Reveal>
                      <h2 className="h2">Seven years of important work, buried inside a bureaucratic website.</h2>
                    </Reveal>
                    <ol className="cs-steps">
                      {[
                        { t: 'The problem', b: 'SCIS\'s research is urgent, politically-engaged, and globally cited. But the Wits University website couldn\'t communicate any of that urgency. Navigation, hierarchy, and tone all pushed against them.' },
                        { t: 'The aspiration', b: 'A standalone site that feels like the centre it represents — rigorous and activist at once. Not a university microsite, but a proper editorial and research presence, capable of growing with the centre.' },
                        { t: 'The complexity', b: 'SCIS produces across six interconnected research streams, nine partner countries, and seven years of publication history. Making that navigable — and meaningful — required real IA thinking, not just pretty pages.' },
                      ].map((s, i) => (
                        <Reveal key={i} delay={i * 70} as="li" className="cs-step">
                          <span className="cs-step-n mono">0{i + 1}</span>
                          <div>
                            <h3 className="cs-step-t">{s.t}</h3>
                            <p className="cs-step-b">{s.b}</p>
                          </div>
                        </Reveal>
                      ))}
                    </ol>
                  </div>
                  <Reveal delay={120}>
                    <p className="lede">
                      Inequality research sits at the intersection of academic rigour and
                      political urgency. The centre's funders include the Bill & Melinda Gates
                      Foundation, Ford Foundation, and GIZ. Its research shapes national budget
                      decisions. It deserved a digital home that matched that weight.
                    </p>
                    <p className="lede" style={{ marginTop: 16 }}>
                      We started by mapping seven years of output across the six research
                      streams — Budgets, Wealth, Work, Care, and Climate. The IA challenge
                      wasn't just organising content; it was building a system flexible enough
                      to surface the work in ways that serve both academics looking for
                      citations and policymakers looking for arguments.
                    </p>
                    <div style={{ marginTop: 32, padding: '24px 26px', background: 'var(--bg-2)', border: '1px solid var(--line)', borderLeft: `3px solid ${ACCENT}`, borderRadius: '0 8px 8px 0' }}>
                      <p style={{ margin: 0, fontSize: 15, fontStyle: 'italic', fontFamily: "'Instrument Serif', serif", color: 'var(--fg-2)', lineHeight: 1.6 }}>
                        "We needed something that showed the breadth of the work without
                        flattening it. Something that said: this place thinks seriously, and
                        takes that thinking into the world."
                      </p>
                      <div className="mono dim" style={{ marginTop: 10, fontSize: 11 }}>— SCIS brief, Feb 2026</div>
                    </div>
                  </Reveal>
                </div>
              </div>
            </section>

            <section className="cs-section">
              <div className="container">
                <div className="cs-section-head">
                  <Eyebrow num="02">What we built</Eyebrow>
                  <Reveal>
                    <h2 className="h2">Evidence that moves. A site built for the work it carries.</h2>
                  </Reveal>
                </div>
                <Reveal>
                  <div className="cs-visual-wrap">
                    <ShowcaseArt />
                  </div>
                </Reveal>
                <div className="cs-approach-grid">
                  {[
                    { n: '01', t: 'Information architecture', b: 'Mapped seven years of output into a navigable system — six research streams as first-class citizens, each with its own publication trail, researchers, and policy implications.' },
                    { n: '02', t: 'Interactive data', b: 'Built a scrollable impact timeline, a rotating globe for the partner network across nine countries, animated research-stream tabs, and a funder showcase. Data as storytelling.' },
                    { n: '03', t: 'Brand & editorial tone', b: 'Found the voice that lives between "peer-reviewed paper" and "open letter". Heavy type, deliberate white space, a green accent that signals growth and urgency. A site that argues.' },
                  ].map((a, i) => (
                    <Reveal key={i} delay={i * 80} className="cs-approach-item">
                      <div className="cs-approach-n">{a.n}</div>
                      <h3 className="cs-approach-t">{a.t}</h3>
                      <p className="cs-approach-b">{a.b}</p>
                    </Reveal>
                  ))}
                </div>
              </div>
            </section>

            <section className="cs-section">
              <div className="container">
                <Eyebrow num="03">Outcomes</Eyebrow>
                <Reveal>
                  <h2 className="h2">A centre with seven years of impact,<br />finally with a home that proves it.</h2>
                </Reveal>
                <div className="cs-stats">
                  {[
                    { v: '6', l: 'Research streams surfaced as navigable, living programmes' },
                    { v: '9', l: 'Partner countries mapped on an interactive globe' },
                    { v: '14', l: 'Academic institutions represented in the partner network' },
                  ].map((s, i) => (
                    <Reveal key={i} delay={i * 80} className="cs-stat">
                      <div className="cs-stat-v">{s.v}</div>
                      <div className="cs-stat-l">{s.l}</div>
                    </Reveal>
                  ))}
                </div>
                <Reveal delay={120}>
                  <p className="cs-closing">
                    The site launches mid-2026, giving SCIS a home that can grow with the
                    centre — news, events, publications, teaching programmes, fellowship calls.
                    Research this important deserves infrastructure that amplifies it.
                  </p>
                </Reveal>
              </div>
            </section>

            <div className="cs-next">
              <div className="container">
                <div className="cs-next-inner">
                  <div>
                    <div className="mono dim cs-next-label">Next project</div>
                    <div className="cs-next-name">{NEXT.name}</div>
                    <div className="cs-next-cat mono dim">{NEXT.cat}</div>
                  </div>
                  <a href={NEXT.href} className="btn btn--accent btn--lg" style={{ ['--accent']: ACCENT }}>
                    View case study
                    <svg width="14" height="14" viewBox="0 0 12 12" fill="none">
                      <path d="M3 9L9 3M9 3H4M9 3V8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </main>
          <CaseFooter accent={ACCENT} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
  </script>
</body>
</html>
