<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aucor Property — Vanta Labs Case Study</title>
  <meta name="description" content="How we redesigned Aucor Property's website — a 30-year auction house rewritten for the way buyers actually decide today." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="case-study.css" />
  <style>
    :root { --accent: #d8ff3b; --on-accent: #0a0908; }
    [data-theme="dark"]  .cs-stat-v { color: var(--accent); }
    [data-theme="light"] .cs-stat-v { color: var(--fg); }

    .term-hero {
      position: absolute; inset: 0;
      background: #050403;
      padding: 20px;
      display: flex; flex-direction: column;
    }
    .term-win {
      flex: 1;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #0a0908;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    }
    .term-win-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      flex-shrink: 0;
    }
    .term-win-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); }
    .term-win-title {
      margin-left: auto;
      font-family: var(--font-mono); font-size: 10.5px;
      color: rgba(255,255,255,0.4); letter-spacing: 0.04em;
    }
    .term-win-body {
      padding: 16px 18px;
      font-family: var(--font-mono); font-size: 11.5px;
      line-height: 1.9; color: rgba(255,255,255,0.75);
      flex: 1; overflow: hidden;
    }
    .tl { display: flex; gap: 12px; }
    .tl-t { color: rgba(255,255,255,0.28); width: 34px; flex-shrink: 0; font-size: 10px; padding-top: 1px; }
    .tl--prompt .tl-s::before { content: '$ '; color: var(--accent); }
    .tl--ok      .tl-s { color: #b9c8a4; }
    .tl--accent  .tl-s { color: var(--accent); font-weight: 600; }
    .tl--dim     .tl-s { color: rgba(255,255,255,0.38); }
    .tl-cursor {
      display: inline-block; width: 7px; height: 13px;
      vertical-align: -2px; background: var(--accent); margin-left: 3px;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    [data-theme="light"] .term-hero { background: #0a0908; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel">
    const ACCENT = '#d8ff3b';
    const { useState, useEffect, useRef } = React;

    function HeroArt() {
      const lines = [
        { type: 'dim',    t: '09:14', s: 'vanta-labs/aucor-property — sprint' },
        { type: 'prompt', t: '09:14', s: 'vanta deploy --client=aucor --env=staging' },
        { type: 'ok',     t: '09:14', s: '✓  brand tokens compiled' },
        { type: 'ok',     t: '09:14', s: '✓  property listing engine built' },
        { type: 'ok',     t: '09:14', s: '✓  countdown timers wired to live feed' },
        { type: 'ok',     t: '09:14', s: '✓  bidder registration flow tested' },
        { type: 'ok',     t: '09:15', s: '✓  CMS agent onboarding complete' },
        { type: 'accent', t: '09:15', s: '→  staging.aucorproperty.co.za  ready' },
        { type: 'dim',    t: '09:15', s: '18 days · brief → production-ready' },
        { type: 'prompt', t: '09:15', s: '' },
      ];
      return (
        <div className="term-hero">
          <div className="term-win">
            <div className="term-win-bar">
              <div className="term-win-dot" />
              <div className="term-win-dot" />
              <div className="term-win-dot" />
              <span className="term-win-title">vanta — zsh</span>
            </div>
            <div className="term-win-body">
              {lines.map((l, i) => (
                <div key={i} className={`tl tl--${l.type}`}>
                  <span className="tl-t">{l.t}</span>
                  <span className="tl-s">{l.s}{i === lines.length - 1 && <span className="tl-cursor" />}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ShowcaseArt() {
      const props = [
        { type:'Industrial', name:'Pomona Rd, Kempton Park', price:'R 8.2M', lots:'07/22' },
        { type:'Commercial', name:'12 Marlboro Dr, Sandton', price:'R 14.8M', lots:'08/22' },
        { type:'Mixed Use',  name:'55 Voortrekker St, Pretoria', price:'R 5.5M', lots:'09/22' },
      ];
      return (
        <div style={{ position:'absolute', inset:0, background:`radial-gradient(80% 60% at 80% 20%, color-mix(in oklab, ${ACCENT} 18%, transparent), transparent 55%), linear-gradient(160deg, #0a0a0c, #15151a)`, overflow:'hidden' }}>
          <div className="art-grid-overlay" />
          <div style={{ position:'absolute', top:0, left:0, right:0, height:40, background:'rgba(0,0,0,0.5)', borderBottom:'1px solid rgba(255,255,255,0.06)', display:'flex', alignItems:'center', padding:'0 16px', gap:8 }}>
            {['#ff5f57','#febc2e','#28c840'].map(c => <span key={c} style={{ width:10, height:10, borderRadius:'50%', background:c, opacity:0.7 }} />)}
            <div style={{ flex:1, margin:'0 12px', height:22, background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:4, display:'flex', alignItems:'center', paddingLeft:8 }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(255,255,255,0.3)', letterSpacing:'0.04em' }}>aucorproperty.co.za</span>
            </div>
          </div>
          <div style={{ position:'absolute', top:40, left:0, right:0, height:38, background:'rgba(0,0,0,0.35)', borderBottom:'1px solid rgba(255,255,255,0.06)', display:'flex', alignItems:'center', padding:'0 24px', gap:24 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:10, color:ACCENT, fontWeight:600, letterSpacing:'0.04em' }}>AUCOR</span>
            {['AUCTIONS','PROPERTIES','HOW IT WORKS','CONTACT'].map(t => (
              <span key={t} style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(255,255,255,0.4)', letterSpacing:'0.06em' }}>{t}</span>
            ))}
            <div style={{ marginLeft:'auto', padding:'4px 12px', borderRadius:999, background:ACCENT, fontFamily:'var(--font-mono)', fontSize:9, color:'#0a0908', letterSpacing:'0.06em', fontWeight:600 }}>REGISTER</div>
          </div>
          <div style={{ position:'absolute', top:94, left:24, right:24, bottom:16, display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:12, alignContent:'start' }}>
            {props.map((p, i) => (
              <div key={i} style={{ background:'rgba(255,255,255,0.03)', border:`1px solid ${i === 0 ? ACCENT+'60' : 'rgba(255,255,255,0.08)'}`, borderRadius:8, overflow:'hidden' }}>
                <div style={{ height:80, background:i===0?`linear-gradient(135deg, color-mix(in oklab, ${ACCENT} 18%, transparent), rgba(21,21,26,0.8))`:`linear-gradient(135deg, rgba(255,255,255,0.04), rgba(21,21,26,0.8))`, position:'relative', display:'flex', alignItems:'center', justifyContent:'center' }}>
                  <div style={{ width:'50%', height:'55%', border:'1px solid rgba(255,255,255,0.08)', borderRadius:4, background:'rgba(255,255,255,0.03)' }} />
                  <div style={{ position:'absolute', top:6, left:6, fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.08em', padding:'2px 6px', borderRadius:3, background:'rgba(0,0,0,0.6)', color: i===0 ? ACCENT : 'rgba(255,255,255,0.5)' }}>{p.lots}</div>
                </div>
                <div style={{ padding:'10px 10px 12px' }}>
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(255,255,255,0.35)', letterSpacing:'0.08em', marginBottom:4, textTransform:'uppercase' }}>{p.type}</div>
                  <div style={{ fontSize:10.5, fontWeight:500, color:'#fff', lineHeight:1.3, marginBottom:6 }}>{p.name}</div>
                  <div style={{ fontSize:11, fontWeight:600, color: i===0 ? ACCENT : 'rgba(255,255,255,0.7)' }}>{p.price}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const NEXT = { name: 'SCIS @ Wits', cat: 'Academic research · Standalone site', href: 'SCIS at Wits.html' };

    function Page() {
      useEffect(() => {
        document.documentElement.style.setProperty('--accent', ACCENT);
      }, []);
      return (
        <>
          <CaseNav accent={ACCENT} />
          <main>
            <section className="cs-hero">
              <div className="container">
                <Reveal>
                  <a href="../index.html#work" className="cs-back">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="M9 11L5 7l4-4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                    All work
                  </a>
                </Reveal>
                <Reveal delay={40}>
                  <div className="cs-chips">
                    <span className="cs-chip"><span className="cs-chip-dot" style={{ background:ACCENT, color:ACCENT }} />Client work</span>
                    <span className="cs-chip">2025 – 2026</span>
                    <span className="cs-chip">Brand & Web</span>
                    <span className="cs-chip" style={{ borderColor:`${ACCENT}50`, color:ACCENT }}>Launching mid-2026</span>
                  </div>
                </Reveal>
                <div className="cs-hero-grid">
                  <div>
                    <Reveal delay={80}>
                      <h1 className="display">
                        A 30-year auction house,{' '}
                        <span className="display-em">rewritten for the way buyers decide today.</span>
                      </h1>
                    </Reveal>
                    <Reveal delay={160}>
                      <p className="lede">
                        Aucor Property has been running commercial and industrial auctions
                        in South Africa since 1994. We were brought in to drag the brand — and
                        the website — into the era of the buyer who does their research on a
                        phone, at 11pm, before committing to anything.
                      </p>
                    </Reveal>
                    <Reveal delay={220}>
                      <div className="cs-services">
                        {['Brand refresh','UX & UI','Web build'].map(s => (
                          <span key={s} className="tag">{s}</span>
                        ))}
                      </div>
                    </Reveal>
                  </div>
                  <Reveal delay={120} className="cs-hero-art">
                    <HeroArt />
                  </Reveal>
                </div>
              </div>
            </section>

            <section className="cs-section">
              <div className="container">
                <Eyebrow num="01">The brief</Eyebrow>
                <div className="cs-2col">
                  <div>
                    <Reveal>
                      <h2 className="h2">A trusted name working with an outdated front door.</h2>
                    </Reveal>
                    <ol className="cs-steps">
                      {[
                        { t: 'The problem', b: 'Three decades of transaction history — and a PHP-era website that looked exactly that old. On mobile it was barely navigable. It was losing bidders before they had a chance to believe in the asset.' },
                        { t: 'What they needed', b: 'A site that projected the confidence a buyer needs before placing a serious bid. Clear property listings, friction-free registration, countdown urgency, and a brand that finally matched the calibre of their portfolio.' },
                        { t: 'Our constraint', b: 'Aucor knew their business intimately. We weren\'t there to reinvent how auctions work — we were there to make the digital experience worthy of thirty years of trust.' },
                      ].map((s, i) => (
                        <Reveal key={i} delay={i * 70} as="li" className="cs-step">
                          <span className="cs-step-n mono">0{i + 1}</span>
                          <div>
                            <h3 className="cs-step-t">{s.t}</h3>
                            <p className="cs-step-b">{s.b}</p>
                          </div>
                        </Reveal>
                      ))}
                    </ol>
                  </div>
                  <Reveal delay={120}>
                    <p className="lede">
                      Property auctions are high-stakes. A buyer who doesn't trust the platform
                      won't register. A buyer who can't navigate the listing won't bid. And a
                      brand that looks dated signals — however unfairly — that the properties
                      might be too.
                    </p>
                    <p className="lede" style={{ marginTop: 16 }}>
                      Aucor had the track record. They needed the face to match it. We started
                      with a discovery sprint — understanding the bidder journey, the agent
                      workflow, and what "confidence" actually looks like when someone is
                      considering a R9M commercial asset.
                    </p>
                    <div style={{ marginTop: 32, padding: '24px 26px', background: 'var(--bg-2)', border: '1px solid var(--line)', borderLeft: `3px solid ${ACCENT}`, borderRadius: '0 8px 8px 0' }}>
                      <p style={{ margin: 0, fontSize: 15, fontStyle: 'italic', fontFamily: "'Instrument Serif', serif", color: 'var(--fg-2)', lineHeight: 1.6 }}>
                        "We needed the site to do the first 80% of the selling for us — before a bidder
                        ever picks up the phone."
                      </p>
                      <div className="mono dim" style={{ marginTop: 10, fontSize: 11 }}>— Aucor Property brief, Jan 2026</div>
                    </div>
                  </Reveal>
                </div>
              </div>
            </section>

            <section className="cs-section">
              <div className="container">
                <div className="cs-section-head">
                  <Eyebrow num="02">What we built</Eyebrow>
                  <Reveal>
                    <h2 className="h2">Brand, experience, and a site that earns the bid.</h2>
                  </Reveal>
                </div>
                <Reveal>
                  <div className="cs-visual-wrap">
                    <ShowcaseArt />
                  </div>
                </Reveal>
                <div className="cs-approach-grid">
                  {[
                    { n: '01', t: 'Brand refresh', b: 'Evolved the Aucor identity to feel authoritative and contemporary — without abandoning the thirty years of trust equity already built. Tighter type, stronger colour system, confident layouts.' },
                    { n: '02', t: 'Bidder experience', b: 'Mapped the full journey from discovery to registered bidder. Designed for the night-before-auction scenario: properties findable, detail scannable, registration frictionless.' },
                    { n: '03', t: 'Full web build', b: 'Custom-built on modern foundations — property listing engine, live countdown timers, registration flows, and a CMS agents can actually use without calling IT.' },
                  ].map((a, i) => (
                    <Reveal key={i} delay={i * 80} className="cs-approach-item">
                      <div className="cs-approach-n">{a.n}</div>
                      <h3 className="cs-approach-t">{a.t}</h3>
                      <p className="cs-approach-b">{a.b}</p>
                    </Reveal>
                  ))}
                </div>
              </div>
            </section>

            <section className="cs-section">
              <div className="container">
                <Eyebrow num="03">Outcomes</Eyebrow>
                <Reveal>
                  <h2 className="h2">Thirty years of history,<br />finally with the right front door.</h2>
                </Reveal>
                <div className="cs-stats">
                  {[
                    { v: '30y', l: 'of brand heritage, respected and modernised' },
                    { v: 'R17.96B', l: 'in property transacted — the trust we were building on' },
                    { v: '18d', l: 'from brief to production-ready design' },
                  ].map((s, i) => (
                    <Reveal key={i} delay={i * 80} className="cs-stat">
                      <div className="cs-stat-v">{s.v}</div>
                      <div className="cs-stat-l">{s.l}</div>
                    </Reveal>
                  ))}
                </div>
                <Reveal delay={120}>
                  <p className="cs-closing">
                    The site launches mid-2026. What we built is a foundation that can grow
                    with the business — real-time auction feeds, bidder dashboards, performance
                    reporting. The brand is ready for the next thirty years.
                  </p>
                </Reveal>
              </div>
            </section>

            <div className="cs-next">
              <div className="container">
                <div className="cs-next-inner">
                  <div>
                    <div className="mono dim cs-next-label">Next project</div>
                    <div className="cs-next-name">{NEXT.name}</div>
                    <div className="cs-next-cat mono dim">{NEXT.cat}</div>
                  </div>
                  <a href={NEXT.href} className="btn btn--accent btn--lg" style={{ ['--accent']: ACCENT }}>
                    View case study
                    <svg width="14" height="14" viewBox="0 0 12 12" fill="none">
                      <path d="M3 9L9 3M9 3H4M9 3V8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </main>
          <CaseFooter accent={ACCENT} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
  </script>
</body>
</html>
